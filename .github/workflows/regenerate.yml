name: regenerate

on:
  push:
    branches: [main]
    paths:
      - "Wallpapers/**"
      - "scripts/**"
      - ".github/workflows/regenerate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-main
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: install imagemagick and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          identify -version
          ffprobe -version

      - name: regenerate previews and site data
        run: |
          python3 scripts/generate_previews.py
          python3 scripts/generate_site_data.py

      - name: commit regenerated files
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "regenerate previews and site data"
          fi

      - name: rebase and push
        run: |
          if git log -1 --pretty=%s | grep -q '^regenerate previews and site data$'; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
