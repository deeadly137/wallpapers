name: previews

on:
  push:
    branches: [main]
  pull_request:

jobs:
  previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: regenerate previews
        run: python3 scripts/generate_previews.py

      - name: fail if previews are out of date
        if: github.event_name == 'pull_request'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git diff
            echo "::error::previews are out of date, run scripts/generate_previews.py and commit the result"
            exit 1
          fi

      - name: commit regenerated previews
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "regenerate previews"
            git push
          fi
